spring:
  application:
    name: sifap-backend
  datasource:
    url: ${SIFAP_DB_URL:jdbc:postgresql://localhost:5432/sifap}
    username: ${SIFAP_DB_USER:sifap}
    password: ${SIFAP_DB_PASSWORD:sifap}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# CORS explícito (sem wildcard em produção) — Constituição IV
sifap:
  cors:
    allowed-origins: ${SIFAP_CORS_ORIGINS:http://localhost:3000}
